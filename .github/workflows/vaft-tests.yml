name: VAFT offline tests

on:
  push:
    paths:
      - 'vaft/**'
      - '.github/workflows/vaft-tests.yml'
  pull_request:
    paths:
      - 'vaft/**'
      - '.github/workflows/vaft-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test vaft/test/playlist.test.cjs
